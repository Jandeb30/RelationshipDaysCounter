<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship-counter</title>
</head>

<body>
    
    <div id="relationship-counter" class="relationship-counter">
        <h3 style="text-align: center; margin-top: 0; margin-bottom: 5px; font-size: 25px;">Total Days</h3>
        <div class="counter">
            <span id="days" class="days">0</span><span>:</span>
            <span id="hours">00</span><span>:</span>
            <span id="minutes">00</span><span>:</span>
            <span id="seconds">00</span>
        </div>

        <div class="labels">
            <span>Days</span>
            <span>Hours</span>
            <span>Minutes</span>
            <span>Seconds</span>
        </div>

        <h3 style="text-align: center; margin-top: 50px; margin-bottom: 5px; font-size: 25px;">Next Monthsary</h3>

        <div class="counter">
            <span id="monthDays" class="days">0</span><span>:</span>
            <span id="monthHours">00</span><span>:</span>
            <span id="monthMinutes">00</span><span>:</span>
            <span id="monthSeconds">00</span>
        </div>

        <div class="labels">
            <span>Days</span>
            <span>Hours</span>
            <span>Minutes</span>
            <span>Seconds</span>
        </div>
        <p class="footer-text">
            Thank you for everything, <span class="name-font">Sarah.</span>
        </p>
    </div>
    <script src="script.js"></script>
</body>
</body>

</html>
